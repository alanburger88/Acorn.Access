<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Acorn Communicate — Agent Desk</title>
<style>
  :root{--bg:#f6f7f5;--panel:#fff;--ink:#17211b;--mut:#5b6862;--brand:#1b3a2f;--acc:#2f6b4f;--line:#dde3de;--bad:#a33;--ok:#256e43}
  @media (prefers-color-scheme: dark){:root{--bg:#141a16;--panel:#1c231e;--ink:#e8ece9;--mut:#98a49d;--brand:#7fb99a;--acc:#8fcaa9;--line:#2c352f;--bad:#e08a8a;--ok:#7fc79b}}
  *{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
  header{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--brand);color:#fff}
  @media (prefers-color-scheme: dark){header{color:#10241a}}
  header h1{font-size:15px;margin:0;letter-spacing:.06em}
  header input{margin-left:auto;padding:6px 10px;border-radius:6px;border:none;min-width:280px;font:inherit}
  .layout{display:grid;grid-template-columns:300px 1fr;gap:16px;padding:20px;max-width:1280px;margin:0 auto;align-items:start}
  @media (max-width:860px){.layout{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
  label{display:block;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
  input.f,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:13px/1.4 inherit}
  textarea{font:13px/1.4 ui-monospace,monospace;resize:vertical}
  button.act{background:var(--acc);border:none;color:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit}
  button.act.ghost{background:none;color:var(--acc);border:1px solid var(--acc)}
  button.act:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
  ul.results{list-style:none;margin:10px 0 0;padding:0}
  ul.results li{margin:0 0 6px}
  ul.results button{display:block;width:100%;text-align:left;background:none;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;color:var(--ink);cursor:pointer}
  ul.results button[aria-current="true"]{border-color:var(--acc);box-shadow:inset 2px 0 0 var(--acc)}
  ul.results .mut{display:block}
  table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
  tr:last-child td{border-bottom:none}
  .pill{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line)}
  .pill.ok{color:var(--ok);border-color:var(--ok)}.pill.bad{color:var(--bad);border-color:var(--bad)}
  h2{font-size:16px;margin:18px 0 10px}
  h2:first-child{margin-top:0}
  dl.profile{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin:0}
  dl.profile dt{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.04em;align-self:center}
  dl.profile dd{margin:0}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .err{color:var(--bad)}.mut{color:var(--mut)}
  .linkbox{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .linkbox code{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;word-break:break-all;font-size:12px}
  #toast{position:fixed;bottom:18px;right:18px;background:var(--brand);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:340px}
  @media (prefers-color-scheme: dark){#toast{color:#10241a}}
  #toast.show{opacity:1}
  ol.timeline{list-style:none;margin:0;padding:0}
  ol.timeline li{display:flex;gap:12px;padding:5px 0;border-bottom:1px solid var(--line)}
  ol.timeline li:last-child{border-bottom:none}
  ol.timeline time{color:var(--mut);white-space:nowrap;font-size:12px;padding-top:2px}
  .rowbtns{display:flex;gap:6px;flex-wrap:wrap}
</style>
</head>
<body>
<header>
  <h1>ACORN AGENT DESK</h1>
  <span style="opacity:.7;font-size:12px">contact-center assist</span>
  <input id="apikey" type="password" placeholder="Paste tenant API key…" aria-label="API key">
</header>
<div class="layout">
  <aside aria-label="Customer search">
    <div class="card">
      <form id="searchform">
        <label for="q">Find customer</label>
        <input id="q" class="f" type="search" placeholder="Name, email, phone, ref…" autocomplete="off">
        <p style="margin:10px 0 0"><button class="act" type="submit">Search</button></p>
      </form>
      <p id="searcherr" class="err" role="alert"></p>
      <ul id="results" class="results" aria-label="Search results"></ul>
    </div>
  </aside>
  <main id="main" aria-live="polite">
    <p class="mut">Paste your tenant API key above (printed by <code>npm run seed</code>), then search for a customer to open their overview.</p>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const $ = (s)=>document.querySelector(s);
const main = $('#main');
const keyInput = $('#apikey');
keyInput.value = localStorage.getItem('acorn-key')||'';
keyInput.addEventListener('change',()=>localStorage.setItem('acorn-key',keyInput.value));

async function api(path, opts={}){
  const res = await fetch(path,{...opts,headers:{'content-type':'application/json','authorization':'Bearer '+keyInput.value,...(opts.headers||{})}});
  if(!res.ok){const p=await res.json().catch(()=>({detail:res.statusText}));throw new Error(p.title?`${p.title}: ${p.detail??''}`:res.statusText);}
  return res.json();
}
const esc=(s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const when=(t)=>t?new Date(t).toLocaleString():'';
const maskPhone=(p)=>p?String(p).replace(/[\d](?=[\d]{4})/g,'•'):'';
const pill=(s)=>`<span class="pill ${['delivered','archived','granted','completed'].includes(s)?'ok':(['failed','bounced','revoked','denied'].includes(s)?'bad':'')}">${esc(s)}</span>`;

let toastTimer;
function toast(msg){
  const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3500);
}

let selectedId=null;

$('#searchform').addEventListener('submit', async (e)=>{
  e.preventDefault();
  $('#searcherr').textContent='';
  const q=$('#q').value.trim();
  try{
    const hits=await api('/v1/agent/customers?q='+encodeURIComponent(q));
    $('#results').innerHTML = hits.map(c=>`<li><button type="button" data-id="${esc(c.id)}" aria-current="${c.id===selectedId}">
      <strong>${esc(c.name)}</strong>
      <span class="mut">${esc(c.email||'no email')}${c.phone?' · '+esc(maskPhone(c.phone)):''}</span>
    </button></li>`).join('') || '<li class="mut">No matches.</li>';
  }catch(err){$('#searcherr').textContent=err.message;}
});
$('#results').addEventListener('click',(e)=>{
  const btn=e.target.closest('button[data-id]');
  if(btn) openCustomer(btn.dataset.id);
});

async function openCustomer(id){
  selectedId=id;
  document.querySelectorAll('#results button[data-id]').forEach(b=>b.setAttribute('aria-current',b.dataset.id===id));
  main.innerHTML='<p class="mut">Loading overview…</p>';
  try{ renderOverview(await api(`/v1/agent/customers/${id}/overview`)); }
  catch(err){ main.innerHTML=`<p class="err">${esc(err.message)}</p>`; }
}

function renderOverview(o){
  const c=o.customer, prefs=o.preferences;
  const consentBadges=(o.consents||[]).map(cn=>
    `<span class="pill ${cn.granted?'ok':'bad'}">${esc(cn.channel)} · ${esc(cn.purpose)} · ${cn.granted?'granted':'denied'}</span>`).join('')||'<span class="mut">No consent records.</span>';
  const prefBadges=prefs?`
    ${(prefs.channelPriority||[]).map((ch,i)=>`<span class="pill">${i+1}. ${esc(ch)}</span>`).join('')}
    <span class="pill ${prefs.paperless?'ok':''}">${prefs.paperless?'paperless':'paper ok'}</span>
    ${prefs.language?`<span class="pill">lang ${esc(prefs.language)}</span>`:''}`
    :'<span class="mut">No preference record.</span>';

  main.innerHTML=`
  <div class="card">
    <h2>${esc(c.name)}</h2>
    <dl class="profile">
      <dt>Email</dt><dd>${esc(c.email||'—')}</dd>
      <dt>Phone</dt><dd>${esc(c.phone||'—')}</dd>
      <dt>Locale</dt><dd>${esc(c.locale||'—')}</dd>
      <dt>External ref</dt><dd>${esc(c.externalRef||'—')}</dd>
    </dl>
  </div>
  <div class="card">
    <h2>Preferences &amp; consent</h2>
    <div class="badges">${prefBadges}</div>
    <div class="badges">${consentBadges}</div>
  </div>
  <h2 id="comms-h">Communications (${o.communications.length})</h2>
  <table aria-labelledby="comms-h"><thead><tr><th>Title</th><th>Status</th><th>Outcome</th><th>Created</th><th>Actions</th></tr></thead><tbody>
  ${o.communications.map(m=>`<tr>
    <td>${esc(m.composed?.title||m.id)}<br><span class="mut"><code>${esc(m.id.slice(0,18))}…</code></span></td>
    <td>${pill(m.status)}</td>
    <td>${m.outcome?.achieved?`<span class="pill ok">achieved${m.outcome.via?' '+esc(m.outcome.via):''}</span>`:'<span class="mut">pending</span>'}</td>
    <td>${when(m.createdAt)}</td>
    <td><div class="rowbtns">
      <button class="act ghost" type="button" data-act="resend" data-com="${esc(m.id)}">Resend</button>
      <button class="act ghost" type="button" data-act="reissue" data-com="${esc(m.id)}">New secure link</button>
      <button class="act ghost" type="button" data-act="ctimeline" data-com="${esc(m.id)}">Timeline</button>
    </div></td></tr>`).join('')||'<tr><td colspan="5" class="mut">No communications for this customer.</td></tr>'}
  </tbody></table>
  <div id="actionerr" class="err" role="alert"></div>
  <div id="detail"></div>
  <h2>Recent timeline</h2>
  <div class="card"><ol class="timeline">
  ${o.recentTimeline.map(t=>`<li><time datetime="${esc(t.at)}">${when(t.at)}</time><span>${esc(t.summary)}</span></li>`).join('')||'<li class="mut">No recent events.</li>'}
  </ol></div>
  <h2>Service note</h2>
  <div class="card">
    <form id="noteform">
      <label for="note">Add a note to this customer's timeline (1–500 characters)</label>
      <textarea id="note" rows="3" maxlength="500" required></textarea>
      <p style="margin:10px 0 0"><button class="act" type="submit">Add note</button> <span id="noteerr" class="err" role="alert"></span></p>
    </form>
  </div>`;

  main.querySelectorAll('button[data-act]').forEach(btn=>{
    btn.addEventListener('click',()=>rowAction(btn.dataset.act,btn.dataset.com,btn));
  });
  $('#noteform').addEventListener('submit', async (e)=>{
    e.preventDefault();
    $('#noteerr').textContent='';
    try{
      await api(`/v1/agent/customers/${c.id}/notes`,{method:'POST',body:JSON.stringify({note:$('#note').value})});
      $('#note').value='';
      toast('Note added to the customer timeline.');
      openCustomer(c.id); // refresh timeline
    }catch(err){$('#noteerr').textContent=err.message;}
  });
}

async function rowAction(act, comId, btn){
  $('#actionerr').textContent='';
  btn.disabled=true;
  try{
    if(act==='resend'){
      const attempts=await api(`/v1/agent/communications/${comId}/resend`,{method:'POST',body:'{}'});
      toast(`Resend triggered — ${attempts.length} delivery attempt${attempts.length===1?'':'s'}.`);
    }else if(act==='reissue'){
      const r=await api(`/v1/agent/communications/${comId}/reissue-link`,{method:'POST',body:'{}'});
      $('#detail').innerHTML=`<div class="card"><h2>Fresh secure link</h2>
        <p class="mut">Previous links for <code>${esc(comId.slice(0,18))}…</code> were revoked. Expires ${when(r.expiresAt)}.</p>
        <div class="linkbox"><code id="freshurl">${esc(r.url)}</code>
        <button class="act ghost" type="button" id="copyurl">Copy link</button></div></div>`;
      $('#copyurl').addEventListener('click', async ()=>{
        try{await navigator.clipboard.writeText(r.url);toast('Link copied to clipboard.');}
        catch(e){toast('Copy failed — select the link text manually.');}
      });
      toast('New secure link issued.');
    }else if(act==='ctimeline'){
      const t=await api(`/v1/communications/${comId}/timeline`);
      $('#detail').innerHTML=`<div class="card"><h2>Communication timeline — <code>${esc(comId.slice(0,18))}…</code></h2>
      <ol class="timeline">${t.map(e=>`<li><time datetime="${esc(e.at)}">${when(e.at)}</time><span>${esc(e.summary)}</span></li>`).join('')||'<li class="mut">No events.</li>'}</ol></div>`;
    }
  }catch(err){$('#actionerr').textContent=err.message;}
  finally{btn.disabled=false;}
}
</script>
</body>
</html>
