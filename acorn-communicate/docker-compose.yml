services:
  acorn-communicate:
    build: .
    ports:
      - "4000:4000"
    environment:
      ACORN_BASE_URL: http://localhost:4000
      ACORN_STORE: sqlite # or unset for the file-backed reference store
      # ANTHROPIC_API_KEY: sk-...   # optional: enables the LLM assistant provider
      # ACORN_ANTHROPIC_MODEL: claude-sonnet-5
      # ACORN_S3_ENDPOINT: http://minio:9000   # optional: offsite WORM archive replication
      # ACORN_S3_BUCKET: acorn-archive
      # ACORN_S3_ACCESS_KEY: ...
      # ACORN_S3_SECRET_KEY: ...
      # ACORN_BLOCK_PRIVATE_WEBHOOKS: "1"      # SSRF guard (implied by NODE_ENV=production)
    volumes:
      - acorn-data:/data
    restart: unless-stopped

volumes:
  acorn-data:
